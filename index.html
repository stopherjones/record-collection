<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My virtual Record Collection</title>
  <meta name="google-site-verification" content="b6V_v5n97L1u_l5J3L9c-U9n9n0C9j9n0C9n0C9n0" />
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <div class="title-row">
      <div>
        <h1>Virtual Record Collection</h1>
        <div class="subtitle">Browse by artist, theme or year</div>
      </div>
      <button id="random-btn" class="icon-btn" aria-label="Random entry" title="Random entry">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="3"/>
          <circle cx="8" cy="8" r="1.2" fill="currentColor"/>
          <circle cx="16" cy="8" r="1.2" fill="currentColor"/>
          <circle cx="12" cy="12" r="1.2" fill="currentColor"/>
          <circle cx="8" cy="16" r="1.2" fill="currentColor"/>
          <circle cx="16" cy="16" r="1.2" fill="currentColor"/>
        </svg>
      </button>
    </div>

    <div class="header-actions">
      <div class="pill-row">
        <select id="tag-select" class="filter-select" aria-label="Filter records by tag"></select>
      </div>

      <div class="pill-row" role="group" aria-label="Sort records">
        <span class="pill-label">Sort</span>
        <button class="pill" data-sort="title" aria-pressed="true">Title</button>
        <button class="pill" data-sort="artist" aria-pressed="false">Artist</button>
        <button class="pill" data-sort="year" aria-pressed="false">Year</button>
        <button class="pill" id="christmas-toggle" aria-pressed="true">Hide Christmas</button>
      </div>

      <div class="controls-bottom">
        <input id="search-input" class="search-input" type="search"
          placeholder="Search by title, artist, tag or year" aria-label="Search records">
      </div>
    </div>
  </header>

  <main>
    <div class="result-count" id="result-count"></div>
    <div class="cards" id="cards">
      <div class="loading">
        <div class="spinner"></div>
        Loading record data…
      </div>
    </div>
  </main>

  <script>
    // ── State ───────────────────────────────────────────────────────────────────
    const state = {
      records: [],
      tag: 'all',                // 'all' or a single tag
      sort: 'title',
      hideChristmas: true,       // matches the button's initial pressed state
      search: '',
    };

    // ── Load ────────────────────────────────────────────────────────────────────
    fetch('records.json?_=' + Date.now())
      .then(r => r.json())
      .then(data => {
        const raw = Array.isArray(data) ? data : [];
        normaliseTags(raw);
        state.records = raw;
        initControls();
        render();
      })
      .catch(err => {
        document.getElementById('cards').innerHTML =
          `<div class="empty">⚠️ Could not load record data.<br><small>${esc(err.message)}</small></div>`;
      });

    // Merge case variants ("main" / "Main") into the most common spelling
    function normaliseTags(records) {
      const counts = new Map();   // lowercase -> Map(raw -> count)
      records.forEach(r => {
        (r.tags || []).forEach(raw => {
          const t = String(raw || '').trim();
          if (!t) return;
          const key = t.toLowerCase();
          if (!counts.has(key)) counts.set(key, new Map());
          const m = counts.get(key);
          m.set(t, (m.get(t) || 0) + 1);
        });
      });
      const canonical = new Map();
      counts.forEach((variants, key) => {
        const best = [...variants.entries()].sort((a, b) => b[1] - a[1])[0][0];
        canonical.set(key, best);
      });
      records.forEach(r => {
        r.tags = [...new Set((r.tags || [])
          .map(t => canonical.get(String(t || '').trim().toLowerCase()))
          .filter(Boolean))];
      });
    }

    // ── Controls ────────────────────────────────────────────────────────────────
    function initControls() {
      state.hideChristmas = document.getElementById('christmas-toggle')
        .getAttribute('aria-pressed') === 'true';

      document.querySelectorAll('[data-sort]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.sort = btn.dataset.sort;
          document.querySelectorAll('[data-sort]').forEach(b =>
            b.setAttribute('aria-pressed', String(b === btn)));
          render();
        });
      });

      document.getElementById('christmas-toggle').addEventListener('click', e => {
        state.hideChristmas = !state.hideChristmas;
        e.currentTarget.setAttribute('aria-pressed', String(state.hideChristmas));
        render();
      });

      document.getElementById('search-input').addEventListener('input', e => {
        state.search = e.target.value.trim().toLowerCase();
        render();
      });

      document.getElementById('random-btn').addEventListener('click', () => {
        const list = sortRecords(visibleRecords());
        if (!list.length) return;
        render(Math.floor(Math.random() * list.length));
      });

      document.getElementById('tag-select').addEventListener('change', e => {
        state.tag = e.target.value;
        render();
      });
    }

    // ── Filtering & sorting ─────────────────────────────────────────────────────
    function isChristmas(record) {
      return searchText(record).includes('christmas');
    }

    function searchText(record) {
      return [record.title, record.artist, ...(record.tags || []), record.year]
        .filter(Boolean).join(' ').toLowerCase();
    }

    // Records passing the Christmas and search filters (used for pill counts too)
    function baseRecords() {
      return state.records.filter(r => {
        if (state.hideChristmas && isChristmas(r)) return false;
        if (state.search && !searchText(r).includes(state.search)) return false;
        return true;
      });
    }

    // Records that also match the selected tag
    function visibleRecords() {
      return baseRecords().filter(r =>
        state.tag === 'all' || (r.tags || []).includes(state.tag));
    }

    function yearNum(r) {
      const n = Number(r.year);
      return r.year && Number.isFinite(n) ? n : null;
    }

    function cmp(a, b) {
      return String(a || '').localeCompare(String(b || ''), undefined,
        { sensitivity: 'base', numeric: true });
    }

    function sortRecords(list) {
      return [...list].sort((a, b) => {
        if (state.sort === 'year') {
          const ya = yearNum(a), yb = yearNum(b);
          if (ya === null && yb !== null) return 1;   // undated (playlists) last
          if (yb === null && ya !== null) return -1;
          if (ya !== null && ya !== yb) return ya - yb;
        } else if (state.sort === 'artist') {
          const c = cmp(a.artist, b.artist);
          if (c) return c;
        }
        return cmp(a.title, b.title);
      });
    }

    // ── Render ──────────────────────────────────────────────────────────────────
    function render(highlightIndex) {
      renderTagSelect();

      const list = sortRecords(visibleRecords());
      const container = document.getElementById('cards');
      document.getElementById('random-btn').disabled = list.length === 0;
      document.getElementById('result-count').textContent =
        `${list.length} record${list.length === 1 ? '' : 's'}`;

      if (!list.length) {
        container.innerHTML = '<div class="empty">No records match these filters.</div>';
        return;
      }

      container.innerHTML = list.map(cardHTML).join('');

      if (typeof highlightIndex === 'number') {
        highlightCardByIndex(highlightIndex);
      }
    }

    function renderTagSelect() {
      const select = document.getElementById('tag-select');
      const base = baseRecords();
      const counts = new Map();
      base.forEach(r => (r.tags || []).forEach(t => counts.set(t, (counts.get(t) || 0) + 1)));

      // List every tag in the collection so the current choice never disappears
      const allTags = new Set();
      state.records.forEach(r => (r.tags || []).forEach(t => allTags.add(t)));
      const tags = [...allTags].sort((a, b) => cmp(a, b));

      select.innerHTML = [
        `<option value="all">All tags (${base.length})</option>`,
        ...tags.map(t =>
          `<option value="${esc(t)}">${esc(t)} (${counts.get(t) || 0})</option>`)
      ].join('');
      select.value = state.tag;
    }

    function cardHTML(record, index) {
      const year = record.year ? esc(String(record.year)) : '';

      const inner = `
        <div class="card-cover">
          ${record.thumbnail
            ? `<img src="${esc(record.thumbnail)}" alt="" decoding="async">`
            : `<div class="no-art">♪</div>`}
          ${record.url ? `<span class="card-open">↗ Spotify</span>` : ''}
        </div>
        <div class="card-body">
          <div class="card-title">${esc(record.title)}</div>
          ${record.artist ? `<div class="card-artist">${esc(record.artist)}</div>` : ''}
          ${year ? `<div class="card-year">${year}</div>` : ''}
        </div>`;

      const label = [record.title, record.artist].filter(Boolean).join(' – ');

      return record.url
        ? `<a class="card" data-card-index="${index}" href="${esc(record.url)}"
              target="_blank" rel="noopener" aria-label="${esc(label)}">${inner}</a>`
        : `<div class="card" data-card-index="${index}">${inner}</div>`;
    }

    // ── Utils ───────────────────────────────────────────────────────────────────
    function highlightCardByIndex(index) {
      document.querySelectorAll('.card.highlighted').forEach(c => c.classList.remove('highlighted'));
      const card = document.querySelector(`.card[data-card-index="${index}"]`);
      if (card) {
        card.classList.add('highlighted');
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    function esc(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
  </script>

  <footer>
    <p>Open-source personal web project built by me, Chris Jones (stopherjones). For more information, see <a href="https://stopherjones.github.io/about.html">About Me</a></p>
  </footer>
</body>

</html>
